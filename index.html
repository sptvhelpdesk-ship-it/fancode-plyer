  <style type="text/css">
      body {
        position:absolute;
        margin: 0;
        padding: 0px;
        background-color: #000000;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        height:100%; width:100%
      }

      .video-container {
        position: absolute ;
        width: 100%; height:100%;
        aspect-ratio: 16/9;
        background-color: #000;
        border-radius: 1px;
        overflow: hidden;
        box-shadow: 0 4px 2px rgba(0,0,0,0.5);
      }

      .shaka-video-container {
        position: absolute ;
        width: 100%; height:100%;
      }

      video {
        width: 100%;
        height: 100%;
        background-color: #000;
      }

      @media (max-width: 768px) {
        body {width:100%;height:100% padding: 1px;}
        .video-container {max-width: 100%;height:100%}
      }

      @media (min-width: 769px) and (max-width: 1024px) {
        .video-container {max-width: 854px;}
      }

      /* YouTube Theme CSS */
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 400;
        src: url(https://fonts.gstatic.com/s/roboto/v27/KFOmCnqEu92Fr1Me5Q.ttf) format('truetype');
      }
      
      .youtube-theme .shaka-bottom-controls {
        width: 100%;
        padding: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
      }

      .youtube-theme .shaka-controls-button-panel {
        height: 60px;
        padding: 0 10px;
      }

      .youtube-theme .shaka-range-container {
        margin: 4px 10px 4px 10px;
        top: 0;
      }

      .youtube-theme .shaka-seek-bar-container {
        height: 3px;
        position: relative;
        top: -1px;
      }

      .youtube-theme .shaka-seek-bar-container:hover {
        height: 5px;
      }

      .youtube-theme .shaka-seek-bar-container input[type=range]::-webkit-slider-thumb {
        background: #FF0000;
      }

      .youtube-theme .shaka-played-range {
        background: rgb(255,0,0) !important;
      }

      .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg {
        display: none !important;
      }
  </style>

<body>
  <div class="video-container">
    <div class="shaka-video-container youtube-theme" id="video-container">
      <video id="video" autoplay muted playsinline preload="auto"></video>
    </div>
  </div>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const url = queryParams.get('url');

    let player;
    const video = document.getElementById('video');
    const container = document.getElementById('video-container');

    async function initializePlayer() {
      try {
        player = new shaka.Player(video);
        
        const ui = new shaka.ui.Overlay(player, container, video);
        const config = {
          'seekBarColors': {
            base: 'rgba(255,255,255,.2)',
            buffered: 'rgba(255,255,255,.4)',
            played: 'rgb(255,0,0)',
          },
          'controlPanelElements': [
            'play_pause', 'mute', 'time_and_duration', 'spacer', 'quality', 'language', 'picture_in_picture', 'fullscreen', 'overflow_menu'
          ]
        };
        ui.configure(config);

        player.configure({
          streaming: { bufferingGoal: 10, rebufferingGoal: 2 },
          abr: { enabled: true }
        });

        await player.load(url);
        
        try {
          await video.play();
        } catch (playError) {
          video.muted = true;
          await video.play();
        }
      } catch (error) {
        console.error('Error:', error);
        video.src = url;
      }
    }

    document.addEventListener('DOMContentLoaded', initializePlayer);
  </script>
