<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8">
  <title>SPORTIFy PLAYER</title>
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  
  <style type="text/css">
      body {
        position:absolute;
        margin: 0;
        padding: 0px;
        background-color: #000000;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        height:100%; width:100%
      }

      .video-container {
        position: absolute ;
        width: 100%; height:100%;
        aspect-ratio: 16/9;
        background-color: #000;
        border-radius: 1px;
        overflow: hidden;
        box-shadow: 0 4px 2px rgba(0,0,0,0.5);
      }

      .shaka-video-container {
        position: absolute ;
        width: 100%; height:100%;
      }

      video {
        width: 100%;
        height: 100%;
        background-color: #000;
      }

      /* Debugger Box Style */
      #debugger-box {
        position: fixed;
        bottom: 80px;
        left: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.9);
        color: #00ff00;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        padding: 15px;
        border: 2px solid #444;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        line-height: 1.5;
        border-radius: 5px;
      }

      @media (max-width: 768px) {
        body {width:100%;height:100% padding: 1px;}
        .video-container {max-width: 100%;height:100%}
      }

      .youtube-theme .shaka-played-range { background: rgb(255,0,0) !important; }
      .youtube-theme .shaka-seek-bar-container input[type=range]::-webkit-slider-thumb { background: #FF0000; }
      .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
  </style>
</head>

<body>
  <div class="video-container">
    <div class="shaka-video-container youtube-theme" id="video-container">
      <video id="video" autoplay muted playsinline preload="auto"></video>
    </div>
  </div>

  <!-- Detailed Debugger Box -->
  <div id="debugger-box"><b>[SYSTEM]</b> Player Engine Ready...</div>

  <script>
    const debugBox = document.getElementById('debugger-box');
    function logDebug(msg, color = "#00ff00") {
      const time = new Date().toLocaleTimeString();
      debugBox.innerHTML += `<br><span style="color:${color}">[${time}] ${msg}</span>`;
      debugBox.scrollTop = debugBox.scrollHeight;
    }

    // Function to translate error codes to Bengali/English explanation
    function getErrorExplanation(error) {
      switch(error.code) {
        case 1001: return "লিঙ্কটি খুঁজে পাওয়া যায়নি (404 Not Found)। দয়া করে URL চেক করুন।";
        case 1002: return "সার্ভার এরর (Bad HTTP Status)। সার্ভার আপনার রিকোয়েস্ট রিজেক্ট করেছে। লিঙ্কটি হয়তো এক্সপায়ার হয়েছে বা ব্লক করা হয়েছে।";
        case 1003: return "নেটওয়ার্কের সমস্যা বা টাইম-আউট। আপনার ইন্টারনেট কানেকশন চেক করুন।";
        case 3014: return "ভিডিও ফরম্যাট সাপোর্ট করছে না। এটি সম্ভবত একটি ইনভ্যালিড MPD বা M3U8 ফাইল।";
        case 3015: return "প্লেলিস্ট বা ম্যানিফেস্ট ফাইলটি পড়তে পারছে না (Parsing Error)।";
        case 6007: return "DRM কী (K1 বা K2) ভুল দেওয়া হয়েছে। ভিডিওটি ডিক্রিপ্ট করা সম্ভব হচ্ছে না।";
        case 6008: return "আপনার ব্রাউজার এই ভিডিওর DRM সিকিউরিটি সাপোর্ট করছে না।";
        default: return "অজানা সমস্যা। বিস্তারিত: " + error.message;
      }
    }

    const queryParams = new URLSearchParams(window.location.search);
    const streamUrl = queryParams.get('play');
    const k1 = queryParams.get('k1');
    const k2 = queryParams.get('k2');

    let player;
    const video = document.getElementById('video');
    const container = document.getElementById('video-container');

    async function initializePlayer() {
      if (!streamUrl) {
        logDebug("ERROR: আপনি কোনো ভিডিও লিঙ্ক (?play=) দেননি!", "red");
        return;
      }

      try {
        player = new shaka.Player(video);
        logDebug("Engine: Shaka Player চালু হয়েছে।");

        const ui = new shaka.ui.Overlay(player, container, video);
        ui.configure({
          'controlPanelElements': ['play_pause', 'mute', 'time_and_duration', 'spacer', 'quality', 'fullscreen', 'overflow_menu']
        });

        const config = {
          streaming: { bufferingGoal: 10, rebufferingGoal: 2 },
          abr: { enabled: true }
        };

        if (k1 && k2) {
          logDebug("DRM: ClearKey পাওয়া গেছে। কী সেট করা হচ্ছে...");
          config.drm = { clearKeys: { [k1]: k2 } };
        } else {
          logDebug("Info: কোনো DRM কী (k1, k2) নেই, সাধারণ স্ট্রীম হিসেবে চেষ্টা করা হচ্ছে।", "yellow");
        }

        player.configure(config);

        logDebug("Status: ভিডিও লোড করার চেষ্টা চলছে...");
        await player.load(streamUrl);
        logDebug("SUCCESS: ভিডিও সাকসেসফুলি লোড হয়েছে!", "cyan");
        
        video.play().then(() => {
            logDebug("Playback: ভিডিও প্লে শুরু হয়েছে।");
        }).catch(e => {
            logDebug("Notice: ব্রাউজার অটো-প্লে আটকেছে, মিউট অবস্থায় চালানো হচ্ছে।", "yellow");
            video.muted = true;
            video.play();
        });

      } catch (error) {
        const explanation = getErrorExplanation(error);
        logDebug(`CRITICAL ERROR: ${error.code}`, "red");
        logDebug(`ব্যাখ্যা: ${explanation}`, "orange");
      }
    }

    document.addEventListener('DOMContentLoaded', initializePlayer);
  </script>
